          from pathlib import Path
          import struct,hashlib
          out=Path('zmk/build-dongle/zephyr');uf2=(out/'zephyr.uf2').read_bytes();binary=(out/'zephyr.bin').read_bytes();config=(out/'.config').read_text()
          for option in ('CONFIG_BOARD_EFOGTECH_DONGLE_1K=y','CONFIG_SOC_NRF52833_QIAA=y','CONFIG_DONGLE_MOUSE_BUTTON_COUNT=8','CONFIG_DONGLE_HID_REPORT_ID_MOUSE=3'):
           assert option in config,option
          assert len(uf2)>0 and len(uf2)%512==0
          payload={};total=len(uf2)//512
          for i in range(total):
           b=uf2[i*512:(i+1)*512];m0,m1,flags,addr,size,num,nblocks,family=struct.unpack_from('<8I',b)
           assert (m0,m1)==(0x0A324655,0x9E5D5157) and struct.unpack_from('<I',b,508)[0]==0x0AB16F30
           assert num==i and nblocks==total and size==256 and flags&0x2000 and family==0x621E937A
           assert 0x1000<=addr and addr+size<=0x6c000 and addr not in payload
           payload[addr]=b[32:32+size]
          image=b''.join(payload[a] for a in sorted(payload))
          assert sorted(payload)==list(range(0x1000,0x1000+256*total,256))
          assert image[:len(binary)]==binary
          # Eight data bits immediately followed by X/Y usages, with no padding item.
          expected=bytes.fromhex('05 09 19 01 29 08 15 00 25 01 75 01 95 08 81 02 05 01 09 30')
          assert expected in binary,'compiled dongle descriptor does not expose eight buttons without padding'
          desc=binary[binary.index(expected):binary.index(expected)+220]
          assert bytes.fromhex('09 38') in desc and bytes.fromhex('05 0c 0a 38 02') in desc
          assert bytes.fromhex('05 09 19 01 29 05 15 00 25 01 75 01 95 05 81 02') not in binary
          p=Path('output/dongle-1k-8buttons-wheels.uf2');p.write_bytes(uf2)
          p=Path('output/zmk.uf2');p.rename('output/endgame-body-8buttons-wheels.uf2')
