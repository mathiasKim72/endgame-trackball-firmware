name: Endgame eight buttons and dual standard wheels
on:
  push:
    branches: [endgame-8buttons-dual-wheel-scroll]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-body-and-dongle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned public modules over HTTPS
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
          git submodule update --init --recursive $(git ls-tree HEAD | awk '$1 == "160000" {print $4}' | grep -v '^endgame-trackball-bootloader$')
      - name: Adapt pinned ZMK and body keymap
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','-C','zmk','rev-parse','HEAD'],text=True).strip()=='a3f7e5c767204b92eaaead3b8ebe0c29bc188dc0'
          assert subprocess.check_output(['git','-C','endgame-trackball-config','rev-parse','HEAD'],text=True).strip()=='a689fe7e68fd3d4cd775bee8ac24146d9eccc3ed'
          def change(path,old,new):
           p=Path(path); s=p.read_text(); assert s.count(old)==1,(path,old); p.write_text(s.replace(old,new))
          change('zmk/app/include/dt-bindings/zmk/pointing.h','#define MB5 BIT(4)','#define MB5 BIT(4)\n#define MB6 BIT(5)\n#define MB7 BIT(6)\n#define MB8 BIT(7)')
          change('zmk/app/include/zmk/hid.h','#define ZMK_HID_MOUSE_NUM_BUTTONS 0x05','#define ZMK_HID_MOUSE_NUM_BUTTONS 0x08')
          change('zmk/app/include/zmk/hid.h','''    HID_REPORT_COUNT(0x5),
              HID_INPUT(ZMK_HID_MAIN_VAL_DATA | ZMK_HID_MAIN_VAL_VAR | ZMK_HID_MAIN_VAL_ABS),
              // Constant padding for the last 3 bits.
              HID_REPORT_SIZE(0x03),
              HID_REPORT_COUNT(0x01),
              HID_INPUT(ZMK_HID_MAIN_VAL_CONST | ZMK_HID_MAIN_VAL_VAR | ZMK_HID_MAIN_VAL_ABS),''','''    HID_REPORT_COUNT(ZMK_HID_MOUSE_NUM_BUTTONS),
              HID_INPUT(ZMK_HID_MAIN_VAL_DATA | ZMK_HID_MAIN_VAL_VAR | ZMK_HID_MAIN_VAL_ABS),''')
          change('zmk/app/src/hid.c','static int explicit_button_counts[5] = {0, 0, 0, 0, 0};','static int explicit_button_counts[ZMK_HID_MOUSE_NUM_BUTTONS] = {0};')
          change('zmk/app/src/pointing/input_listener.c','    case INPUT_BTN_4:','    case INPUT_BTN_4:\n    case INPUT_BTN_5:\n    case INPUT_BTN_6:\n    case INPUT_BTN_7:')
          change('zmk/app/src/behaviors/behavior_mouse_key_press.c','    {.display_name = "MB5", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE, .value = MB5}};','\n'.join('    {.display_name = "MB%d", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE, .value = MB%d}%s'%(i,i,',' if i<8 else '};') for i in range(5,9)))
          p=Path('endgame-trackball-config/config/efogtech_trackball_0.keymap'); s=p.read_text(); start=s.index('    // buttons'); end=s.index('    // rotary encoders',start)
          s=s[:start]+'''    // Eight independent physical mouse buttons (USB/Bluetooth).
                          &mkp MB6  &mkp MB7
                          &mkp MB3  &mkp MB8
                          &mkp MB1  &mkp MB2
                          &mkp MB4  &mkp MB5
          
                      '''+s[end:]; p.write_text(s)
          print('Applied pinned-source eight-button patch.')
      - name: Enable eight-button ESB forwarding and dongle HID
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','-C','zmk-esb-endpoint','rev-parse','HEAD'],text=True).strip()=='d482f54894943759003b04500ee825e11cf52dc3'
          def change(path,old,new):
           p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          change('zmk-esb-endpoint/src/esb/input_processor_esb.c','event->code <= INPUT_BTN_4','event->code <= INPUT_BTN_7')
          change('dongle-1k-firmware/src/usb_hid.c', '''            HID_REPORT_SIZE(1),
                      HID_REPORT_COUNT(8 - CONFIG_DONGLE_MOUSE_BUTTON_COUNT),
                      HID_INPUT(0x01),    /* Const pad */''', '''#if CONFIG_DONGLE_MOUSE_BUTTON_COUNT < 8
                      HID_REPORT_SIZE(1),
                      HID_REPORT_COUNT(8 - CONFIG_DONGLE_MOUSE_BUTTON_COUNT),
                      HID_INPUT(0x01),    /* Const pad */
          #endif''')
          p=Path('dongle-1k-firmware/prj.conf');s=p.read_text();assert 'CONFIG_DONGLE_MOUSE_BUTTON_COUNT=' not in s;p.write_text(s+'\nCONFIG_DONGLE_MOUSE_BUTTON_COUNT=8\n')
          print('Applied ESB eight-button forwarding and dongle eight-bit HID descriptor.')
      - name: Test actual ESB handler and packet serializer
        shell: python
        run: |
          from pathlib import Path
          import subprocess, tempfile
          source=Path('zmk-esb-endpoint/src/esb/input_processor_esb.c').read_text()
          raw=source[source.index('static int send_hid_report_raw'):source.index('/* Caller must hold')]
          handler=source[source.index('static int esb_ip_handle_event'):source.index('static const struct zmk_input_processor_driver_api')]
          hid=Path('zmk/app/include/zmk/hid.h').read_text();body=hid[hid.index('struct zmk_hid_mouse_report_body {'):hid.index('#if IS_ENABLED(CONFIG_ZMK_POINTING_SMOOTH_SCROLLING)',hid.index('struct zmk_hid_mouse_report_body {'))];body=body.split('struct zmk_hid_mouse_report {')[0]
          prefix=r'''
          #include <stdint.h>
          #include <stdbool.h>
          #include <string.h>
          #include <assert.h>
          #include <limits.h>
          #define __packed __attribute__((packed))
          #define BIT(n) (1U << (n))
          #define CLAMP(v,l,h) ((v)<(l)?(l):((v)>(h)?(h):(v)))
          #define CONFIG_ESB_MAX_PAYLOAD_LENGTH 32
          #define ZMK_INPUT_PROC_CONTINUE 0
          #define ZMK_INPUT_PROC_STOP 1
          #define INPUT_EV_REL 2
          #define INPUT_EV_KEY 1
          #define INPUT_REL_X 0
          #define INPUT_REL_Y 1
          #define INPUT_REL_WHEEL 8
          #define INPUT_REL_HWHEEL 6
          #define INPUT_BTN_0 0x100
          #define INPUT_BTN_7 0x107
          #include <zmk_esb/protocol.h>
          typedef uint8_t zmk_mouse_button_flags_t;
          struct input_event {int type,code,value; bool sync;};
          struct zmk_input_processor_state {int unused;};
          struct esb_ip_data {int32_t dx,dy,scroll_x,scroll_y;uint8_t buttons;uint32_t accum_start_ms;};
          struct device {void *data;};
          static bool active=true,connected=true;
          static unsigned sends;
          static uint8_t packet[32];
          static bool zmk_esb_endpoint_is_active(void){return active;}
          static bool pairing_is_connected(void){return connected;}
          static uint32_t k_uptime_get_32(void){return 7;}
          static int esb_transport_send(int pipe,uint8_t *data,int len){assert(pipe==ESB_PIPE_DATA);assert(len==32);memcpy(packet,data,len);sends++;return 0;}
          '''
          stub=r'''
          static void send_mouse_report(struct esb_ip_data *d,bool changed){(void)changed;assert(send_hid_report_raw(d->buttons,d->dx,d->dy,d->scroll_x,d->scroll_y)==0);}
          '''
          main=r'''
          int main(void){
           _Static_assert(sizeof(struct zmk_hid_mouse_report_body)==9,"mouse body changed");
           struct esb_ip_data d={0};struct device dev={&d};struct input_event e={INPUT_EV_KEY,INPUT_BTN_0,1,true};
           active=false;assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_CONTINUE);assert(sends==0);
           active=true;connected=false;assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_CONTINUE);assert(sends==0);connected=true;
           for(unsigned mask=0;mask<256;mask++){
            for(unsigned i=0;i<8;i++){e.code=INPUT_BTN_0+i;e.value=!!(mask&BIT(i));assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_STOP);}
            assert(d.buttons==mask);assert(packet[0]==ESB_PKT_HID_REPORT);assert(packet[1]==ESB_REPORT_MOUSE);assert(packet[2]==mask);
           }
           for(unsigned i=0;i<8;i++){e.code=INPUT_BTN_0+i;e.value=0;esb_ip_handle_event(&dev,&e,0,0,0);assert(!(packet[2]&BIT(i)));}
           e.code=INPUT_BTN_7+1;e.value=1;esb_ip_handle_event(&dev,&e,0,0,0);assert(d.buttons==0);
           send_hid_report_raw(255,40000,-40000,40000,-40000);struct zmk_hid_mouse_report_body b;memcpy(&b,packet+2,sizeof(b));assert(b.buttons==255);assert(b.d_x==INT16_MAX&&b.d_y==INT16_MIN&&b.d_scroll_x==INT16_MAX&&b.d_scroll_y==INT16_MIN);
          }
          '''
          with tempfile.TemporaryDirectory() as temp:
           p=Path(temp)/'esb_test.c';p.write_text(prefix+body+raw+stub+handler+main)
           exe=Path(temp)/'esb_test';subprocess.run(['cc','-std=c11','-fsanitize=address,undefined','-I'+str(Path('zmk-esb-endpoint/include').resolve()),str(p),'-o',str(exe)],check=True);subprocess.run([str(exe)],check=True)
          print('PASS: actual ESB input handler and packet serializer: all 256 button masks, press/release, inactive USB/BLE passthrough, motion packing.')
      - name: Configure left vertical and right horizontal wheel impulses
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','-C','zmk','rev-parse','HEAD'],text=True).strip()=='a3f7e5c767204b92eaaead3b8ebe0c29bc188dc0'
          Path('zmk/app/src/behaviors/behavior_endgame_wheel.c').write_text('/* SPDX-License-Identifier: MIT */\n#define DT_DRV_COMPAT zmk_behavior_endgame_wheel\n#include <zephyr/device.h>\n#include <zephyr/input/input.h>\n#include <drivers/behavior.h>\n#include <zmk/behavior.h>\n#include <dt-bindings/zmk/pointing.h>\n#include <errno.h>\n#if IS_ENABLED(CONFIG_ZMK_POINTING_SMOOTH_SCROLLING)\n#include <zmk/pointing/resolution_multipliers.h>\n#endif\n#if IS_ENABLED(CONFIG_ZMK_ESB_ENDPOINT)\n#include <zmk_esb/endpoint.h>\n#endif\n\n#if DT_HAS_COMPAT_STATUS_OKAY(DT_DRV_COMPAT)\n/* A detent emits one relative wheel impulse. Releasing never starts a timer. */\nstatic int wheel_pressed(struct zmk_behavior_binding *binding,\n                         struct zmk_behavior_binding_event event) {\n    const int16_t x = MOVE_X_DECODE(binding->param1);\n    const int16_t y = MOVE_Y_DECODE(binding->param1);\n    if (!((x == 0 && (y == -1 || y == 1)) ||\n          (y == 0 && (x == -1 || x == 1)))) {\n        return -EINVAL;\n    }\n    const struct device *dev = zmk_behavior_get_binding(binding->behavior_dev);\n    if (!dev) {\n        return -ENODEV;\n    }\n    int multiplier = 1;\n#if IS_ENABLED(CONFIG_ZMK_POINTING_SMOOTH_SCROLLING)\n#if IS_ENABLED(CONFIG_ZMK_ESB_ENDPOINT)\n    if (zmk_esb_endpoint_is_active()) {\n        /* ESB\'s existing wire format uses fixed 16x high-resolution scroll. */\n        multiplier = 16;\n    } else\n#endif\n    {\n        const struct zmk_pointing_resolution_multipliers m =\n            zmk_pointing_resolution_multipliers_get_current_profile();\n        multiplier = 1 + (x ? m.hor_wheel : m.wheel);\n    }\n#endif\n    return input_report_rel(dev, x ? INPUT_REL_HWHEEL : INPUT_REL_WHEEL,\n                            (x ? x : y) * multiplier, true, K_FOREVER);\n}\n\nstatic int wheel_released(struct zmk_behavior_binding *binding,\n                          struct zmk_behavior_binding_event event) {\n    return 0;\n}\n\n#if IS_ENABLED(CONFIG_ZMK_BEHAVIOR_METADATA)\nstatic const struct behavior_parameter_value_metadata wheel_values[] = {\n    {.display_name = "Scroll up", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE,\n     .value = MOVE_Y(1)},\n    {.display_name = "Scroll down", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE,\n     .value = MOVE_Y(-1)},\n    {.display_name = "Scroll right", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE,\n     .value = MOVE_X(1U)},\n    {.display_name = "Scroll left", .type = BEHAVIOR_PARAMETER_VALUE_TYPE_VALUE,\n     .value = MOVE_X(0xFFFFU)},\n};\nstatic const struct behavior_parameter_metadata_set wheel_sets[] = {{\n    .param1_values = wheel_values, .param1_values_len = ARRAY_SIZE(wheel_values),\n}};\nstatic const struct behavior_parameter_metadata wheel_metadata = {\n    .sets_len = ARRAY_SIZE(wheel_sets), .sets = wheel_sets,\n};\n#endif\nstatic const struct behavior_driver_api wheel_api = {\n    .binding_pressed = wheel_pressed,\n    .binding_released = wheel_released,\n#if IS_ENABLED(CONFIG_ZMK_BEHAVIOR_METADATA)\n    .parameter_metadata = &wheel_metadata,\n#endif\n};\n#define WHEEL_INST(n) \\\n    BEHAVIOR_DT_INST_DEFINE(n, NULL, NULL, NULL, NULL, POST_KERNEL, \\\n                           CONFIG_KERNEL_INIT_PRIORITY_DEFAULT, &wheel_api);\nDT_INST_FOREACH_STATUS_OKAY(WHEEL_INST)\n#endif\n')
          Path('endgame-trackball-config/config/endgame_wheel_step.dtsi').write_text('/ {\n    behaviors {\n        endgame_wheel_step: endgame_wheel_step {\n            compatible = "zmk,behavior-endgame-wheel";\n            #binding-cells = <1>;\n            display-name = "Mouse wheel (one detent)";\n        };\n    };\n    endgame_wheel_listener: endgame_wheel_listener {\n        compatible = "zmk,input-listener";\n        device = <&endgame_wheel_step>;\n        input-processors = <&esb_ip>;\n    };\n};\n')
          Path('zmk/app/dts/bindings/behaviors/zmk,behavior-endgame-wheel.yaml').write_text('description: One standard mouse wheel detent\ncompatible: "zmk,behavior-endgame-wheel"\ninclude: one_param.yaml\n')
          p=Path('zmk/app/CMakeLists.txt');p.write_text(p.read_text()+'\ntarget_sources(app PRIVATE src/behaviors/behavior_endgame_wheel.c)\n')
          p=Path('endgame-trackball-config/config/efogtech_trackball_0.keymap');s=p.read_text();s='#include "endgame_wheel_step.dtsi"\n'+s
          start=s.index('default_layer {');end=s.index('\n\t\t};',start);section=s[start:end]
          old='&kp C_VOL_UP              &kp LC(TAB)\n\t\t\t    &kp C_VOL_DN              &kp LC(LS(TAB))'
          new='&endgame_wheel_step MOVE_Y(1)   &endgame_wheel_step MOVE_X(1)\n                &endgame_wheel_step MOVE_Y(-1)  &endgame_wheel_step MOVE_X(-1)'
          assert section.count(old)==1;section=section.replace(old,new);s=s[:start]+section+s[end:];p.write_text(s)
          print('Applied discrete vertical left wheel and horizontal right wheel; eight mouse buttons unchanged.')
      - name: Test discrete wheel events and ESB packet axes
        shell: python
        run: |
          from pathlib import Path
          Path("wheel_esb_base_test.py").write_text('from pathlib import Path\nimport subprocess, tempfile\nsource=Path(\'zmk-esb-endpoint/src/esb/input_processor_esb.c\').read_text()\nraw=source[source.index(\'static int send_hid_report_raw\'):source.index(\'/* Caller must hold\')]\nhandler=source[source.index(\'static int esb_ip_handle_event\'):source.index(\'static const struct zmk_input_processor_driver_api\')]\nhid=Path(\'zmk/app/include/zmk/hid.h\').read_text();body=hid[hid.index(\'struct zmk_hid_mouse_report_body {\'):hid.index(\'#if IS_ENABLED(CONFIG_ZMK_POINTING_SMOOTH_SCROLLING)\',hid.index(\'struct zmk_hid_mouse_report_body {\'))];body=body.split(\'struct zmk_hid_mouse_report {\')[0]\nprefix=r\'\'\'\n#include <stdint.h>\n#include <stdbool.h>\n#include <string.h>\n#include <assert.h>\n#include <limits.h>\n#define __packed __attribute__((packed))\n#define BIT(n) (1U << (n))\n#define CLAMP(v,l,h) ((v)<(l)?(l):((v)>(h)?(h):(v)))\n#define CONFIG_ESB_MAX_PAYLOAD_LENGTH 32\n#define ZMK_INPUT_PROC_CONTINUE 0\n#define ZMK_INPUT_PROC_STOP 1\n#define INPUT_EV_REL 2\n#define INPUT_EV_KEY 1\n#define INPUT_REL_X 0\n#define INPUT_REL_Y 1\n#define INPUT_REL_WHEEL 8\n#define INPUT_REL_HWHEEL 6\n#define INPUT_BTN_0 0x100\n#define INPUT_BTN_7 0x107\n#include <zmk_esb/protocol.h>\ntypedef uint8_t zmk_mouse_button_flags_t;\nstruct input_event {int type,code,value; bool sync;};\nstruct zmk_input_processor_state {int unused;};\nstruct esb_ip_data {int32_t dx,dy,scroll_x,scroll_y;uint8_t buttons;uint32_t accum_start_ms;};\nstruct device {void *data;};\nstatic bool active=true,connected=true;\nstatic unsigned sends;\nstatic uint8_t packet[32];\nstatic bool zmk_esb_endpoint_is_active(void){return active;}\nstatic bool pairing_is_connected(void){return connected;}\nstatic uint32_t k_uptime_get_32(void){return 7;}\nstatic int esb_transport_send(int pipe,uint8_t *data,int len){assert(pipe==ESB_PIPE_DATA);assert(len==32);memcpy(packet,data,len);sends++;return 0;}\n\'\'\'\nstub=r\'\'\'\nstatic void send_mouse_report(struct esb_ip_data *d,bool changed){(void)changed;assert(send_hid_report_raw(d->buttons,d->dx,d->dy,d->scroll_x,d->scroll_y)==0);}\n\'\'\'\nmain=r\'\'\'\nint main(void){\n _Static_assert(sizeof(struct zmk_hid_mouse_report_body)==9,"mouse body changed");\n struct esb_ip_data d={0};struct device dev={&d};struct input_event e={INPUT_EV_KEY,INPUT_BTN_0,1,true};\n active=false;assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_CONTINUE);assert(sends==0);\n active=true;connected=false;assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_CONTINUE);assert(sends==0);connected=true;\n for(unsigned mask=0;mask<256;mask++){\n  for(unsigned i=0;i<8;i++){e.code=INPUT_BTN_0+i;e.value=!!(mask&BIT(i));assert(esb_ip_handle_event(&dev,&e,0,0,0)==ZMK_INPUT_PROC_STOP);}\n  assert(d.buttons==mask);assert(packet[0]==ESB_PKT_HID_REPORT);assert(packet[1]==ESB_REPORT_MOUSE);assert(packet[2]==mask);\n }\n for(unsigned i=0;i<8;i++){e.code=INPUT_BTN_0+i;e.value=0;esb_ip_handle_event(&dev,&e,0,0,0);assert(!(packet[2]&BIT(i)));}\n e.code=INPUT_BTN_7+1;e.value=1;esb_ip_handle_event(&dev,&e,0,0,0);assert(d.buttons==0);\n send_hid_report_raw(255,40000,-40000,40000,-40000);struct zmk_hid_mouse_report_body b;memcpy(&b,packet+2,sizeof(b));assert(b.buttons==255);assert(b.d_x==INT16_MAX&&b.d_y==INT16_MIN&&b.d_scroll_x==INT16_MAX&&b.d_scroll_y==INT16_MIN);\n}\n\'\'\'\nwith tempfile.TemporaryDirectory() as temp:\n p=Path(temp)/\'esb_test.c\';p.write_text(prefix+body+raw+stub+handler+main)\n exe=Path(temp)/\'esb_test\';subprocess.run([\'cc\',\'-std=c11\',\'-fsanitize=address,undefined\',\'-I\'+str(Path(\'zmk-esb-endpoint/include\').resolve()),str(p),\'-o\',str(exe)],check=True);subprocess.run([str(exe)],check=True)\nprint(\'PASS: actual ESB input handler and packet serializer: all 256 button masks, press/release, inactive USB/BLE passthrough, motion packing.\')\n')
          from pathlib import Path
          import subprocess,tempfile,runpy
          base=runpy.run_path('wheel_esb_base_test.py') if Path('wheel_esb_base_test.py').exists() else runpy.run_path('../test_esb_8buttons.py')
          source=Path('zmk/app/src/behaviors/behavior_endgame_wheel.c').read_text();callbacks=source[source.index('static int wheel_pressed'):source.index('#if IS_ENABLED(CONFIG_ZMK_BEHAVIOR_METADATA)')]
          pointing='\n'.join(x for x in Path('zmk/app/include/dt-bindings/zmk/pointing.h').read_text().splitlines() if not x.startswith('#include') and x!='#pragma once')
          extra=r'''
          #include <errno.h>
          #define IS_ENABLED(x) x
          #define CONFIG_ZMK_POINTING_SMOOTH_SCROLLING 1
          #define CONFIG_ZMK_ESB_ENDPOINT 1
          #define K_FOREVER -1
          struct zmk_behavior_binding {const char *behavior_dev;uint32_t param1,param2;};
          struct zmk_behavior_binding_event {int unused;};
          struct zmk_pointing_resolution_multipliers {uint8_t wheel,hor_wheel;};
          static struct zmk_pointing_resolution_multipliers multipliers={15,15};
          static struct zmk_pointing_resolution_multipliers zmk_pointing_resolution_multipliers_get_current_profile(void){return multipliers;}
          static struct esb_ip_data wheel_data;
          static const struct device wheel_dev={&wheel_data};
          static const struct device *zmk_behavior_get_binding(const char *s){return s?&wheel_dev:0;}
          static unsigned wheel_events;static int last_code,last_value;
          static int input_report_rel(const struct device *dev,int code,int value,bool sync,int timeout){
           (void)timeout;wheel_events++;last_code=code;last_value=value;
           struct input_event e={INPUT_EV_REL,code,value,sync};
           return esb_ip_handle_event(dev,&e,0,0,0)==ZMK_INPUT_PROC_STOP?0:0;
          }
          '''
          main=r'''
          int main(void){
           const uint32_t directions[]={MOVE_Y(1),MOVE_Y(-1),MOVE_X(1U),MOVE_X(0xFFFFU)};
           const int codes[]={INPUT_REL_WHEEL,INPUT_REL_WHEEL,INPUT_REL_HWHEEL,INPUT_REL_HWHEEL};
           const int signs[]={1,-1,1,-1};
           struct zmk_behavior_binding b={"endgame_wheel_step",0,0};struct zmk_behavior_binding_event e={0};
           for(int factor=1;factor<=16;factor++){
            active=false;multipliers.wheel=factor-1;multipliers.hor_wheel=factor-1;
            for(int i=0;i<4;i++){b.param1=directions[i];unsigned before=wheel_events;assert(wheel_pressed(&b,e)==0);assert(wheel_events==before+1);assert(last_code==codes[i]&&last_value==signs[i]*factor);assert(wheel_released(&b,e)==0&&wheel_events==before+1);}
           }
           active=true;connected=true;multipliers.wheel=0;multipliers.hor_wheel=0;
           for(int i=0;i<4;i++){
            memset(&wheel_data,0,sizeof(wheel_data));wheel_data.buttons=0xA5;b.param1=directions[i];assert(wheel_pressed(&b,e)==0);
            struct zmk_hid_mouse_report_body r;memcpy(&r,packet+2,sizeof(r));assert(r.buttons==0xA5&&r.d_x==0&&r.d_y==0);
            assert(r.d_scroll_y==(i<2?signs[i]*16:0));assert(r.d_scroll_x==(i>=2?signs[i]*16:0));
           }
           unsigned before=wheel_events;b.param1=0;assert(wheel_pressed(&b,e)==-EINVAL);b.param1=MOVE_X(1U)|MOVE_Y(1);assert(wheel_pressed(&b,e)==-EINVAL);assert(wheel_events==before);
          }
          '''
          code=base['prefix']+base['body']+base['raw']+base['stub']+base['handler']+pointing+extra+callbacks+main
          with tempfile.TemporaryDirectory() as tmp:
